name: Security & Malware Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  clamav-scan:
    name: ClamAV Repository Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav

      - name: Update ClamAV virus definitions
        run: |
          sudo systemctl stop clamav-freshclam || true
          sudo rm -f /var/log/clamav/freshclam.log
          if ! sudo freshclam; then
            echo "freshclam failed; checking if clamav-freshclam already populated definitions..."
            ls -lh /var/lib/clamav/
            test -n "$(find /var/lib/clamav -maxdepth 1 \( -name '*.cvd' -o -name '*.cld' \) -print -quit)"
          fi

      - name: Run recursive ClamAV scan
        run: |
          clamscan -r --bell -i --exclude-dir="^./.git" .
